name: Auto PR release to main

on:
  push:
    branches:
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR release -> main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync release -> main"
          branch: "auto/pr-release-to-main"
          base: "main"
          title: "chore: merge release into main"
          body: |
            Automatic PR created from `release` into `main`.
            Review and merge when ready.
          labels: automated, sync
          delete-branch: false