name: Auto PR to develop

on:
  push:
    branches-ignore:
      - main
      - develop
      - release

permissions:
  contents: write
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR to develop
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync branch -> develop"
          branch: "auto/pr-to-develop-${{ github.sha }}"
          base: "develop"
          title: "chore: merge ${{ github.ref_name }} into develop"
          body: |
            Automatic PR created from branch `${{ github.ref_name }}` into `develop`.
            Source branch: `${{ github.ref_name }}`
          labels: automated, sync
          delete-branch: true