name: Auto PR develop to release

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update PR develop -> release
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync develop -> release"
          branch: "auto/pr-develop-to-release"
          base: "release"
          title: "chore: merge develop into release"
          body: |
            Automatic PR created from `develop` into `release`.
            Review and merge when ready.
          labels: automated, sync
          delete-branch: true